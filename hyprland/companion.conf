
$companion = /home/sair/anime-companion

exec-once = $companion/bin/run.sh

bind  = SUPER, Z, exec, $companion/bin/companion-ctl ptt-start
bindr = SUPER, Z, exec, $companion/bin/companion-ctl ptt-stop
bind = SUPER SHIFT, Z, exec, $companion/bin/companion-ctl interact
bind = SUPER ALT, Z, exec, $companion/bin/companion-ctl toggle
bind = SUPER CTRL, Z, exec, $companion/bin/companion-ctl stop

windowrule = match:title ^(Anime Companion)$, float on, pin on, no_initial_focus on, no_follow_mouse on, border_size 0, no_shadow on, no_blur on, no_dim on, no_anim on, rounding 0, decorate off, size 420 640, move (monitor_w-440) (monitor_h-660)

